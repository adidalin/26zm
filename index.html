<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>趣味英语拼读学习</title>
<style>
:root{--p:#4f46e5;--pl:#eef2ff;--ok:#16a34a;--okl:#dcfce7;--bad:#ef4444;--badl:#fee2e2;--bg:#f6f8fc;--card:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--shadow:0 12px 35px #1e293b17}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Gill Sans","Gill Sans MT",Calibri,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 10% 0,#e0e7ff,transparent 32%),var(--bg);color:var(--text)}nav{position:sticky;top:0;z-index:10;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px 16px;background:#4f46e5f2;box-shadow:0 5px 20px #312e8133}nav button{border:0;border-radius:999px;padding:10px 15px;background:#ffffff2b;color:#fff;font-size:15px;font-weight:700;cursor:pointer}nav button.active,nav button:hover{background:#fff;color:var(--p)}main{width:min(1050px,100%);margin:auto;padding:28px 18px 40px}.view{display:none;animation:in .3s ease}.view.active{display:block}.card{background:#fffffff2;border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:var(--shadow)}h2{text-align:center;color:var(--p);margin-bottom:20px;font-size:clamp(1.35rem,3vw,2rem)}.sub,.help{text-align:center;color:var(--muted);margin:-10px 0 20px}.toolbar,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.outline{background:#fff;color:var(--p);border:1px solid #a5b4fc}.success{background:var(--ok);color:#fff}.danger{background:var(--bad);color:#fff}.ghost{background:#f1f5f9;color:var(--muted)}.alphabet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:12px}.letter-btn{border:2px solid var(--line);border-radius:16px;background:#fff;padding:16px 4px;font-size:30px;font-weight:800;color:var(--p);cursor:pointer}.letter-btn small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.letter-btn:hover{background:var(--pl);border-color:#818cf8}.setup{text-align:center}.toggle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:9px;margin:18px 0 24px}.toggle{border:2px solid var(--line);border-radius:12px;background:#f8fafc;padding:11px 4px;font-size:19px;font-weight:800;color:var(--muted);cursor:pointer}.toggle.selected{background:var(--p);border-color:var(--p);color:#fff}.flashcard-area,.match-area{display:none;text-align:center}.flashcard{width:min(300px,85vw);height:280px;margin:0 auto 22px;display:grid;place-items:center;border-radius:25px;background:linear-gradient(145deg,#fff,#eef2ff);box-shadow:inset 0 0 0 2px #e0e7ff,0 14px 30px #4f46e51f;color:var(--p);font-size:clamp(80px,15vw,130px);font-weight:900}.progress{color:var(--muted);margin-top:18px}.hidden{display:none!important}
/* 新增：六对六连线 */.match-board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(42px,12vw,150px);max-width:760px;margin:15px auto 20px;padding:12px 8px}.match-column{display:flex;flex-direction:column;gap:13px;z-index:2}.match-column h3{text-align:center;color:var(--muted);font-size:14px}.match-item{min-height:54px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:clamp(20px,4vw,30px);font-weight:900;cursor:pointer}.match-item.selected{border-color:var(--p);background:var(--pl);color:var(--p)}.match-item.matched{border-color:var(--ok);background:var(--okl);color:var(--ok);cursor:default}.match-item.wrong{border-color:var(--bad);background:var(--badl);animation:shake .3s}.line-layer{position:absolute;inset:35px 0 0;width:100%;height:calc(100% - 35px);z-index:1;pointer-events:none}.line-layer line{stroke:var(--ok);stroke-width:4;stroke-linecap:round}.score{text-align:center;color:var(--p);font-weight:800;margin:10px}.friend-target{font-size:clamp(75px,14vw,110px);font-weight:900;color:var(--p);margin:15px}.friend-options{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.friend-option{width:78px;height:78px;border:2px solid var(--line);border-radius:15px;background:#fff;font-size:38px;font-weight:900;cursor:pointer}.friend-option.correct{background:var(--ok);color:#fff;border-color:var(--ok)}.friend-option.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}.mistakes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.mistake-item{padding:16px;border-radius:14px;border:2px solid #fecaca;color:var(--bad);font-size:24px;text-align:center;font-weight:800}.empty{text-align:center;color:var(--muted);padding:45px 10px}.modal-overlay{display:none;position:fixed;inset:0;z-index:20;background:#0f172a99;place-items:center;padding:20px}.modal{position:relative;width:min(350px,100%);background:#fff;border-radius:25px;padding:30px;text-align:center}.close{position:absolute;right:18px;top:10px;border:0;background:none;font-size:28px;color:var(--muted);cursor:pointer}.modal-letter{font-size:75px;color:var(--p);font-weight:900}.modal-emoji{font-size:60px}.modal-word{font-size:28px;font-weight:800}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-width:560px){nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}nav button{white-space:nowrap}.match-board{gap:20px;padding:8px 0}.match-item{font-size:22px;min-height:50px}}
</style>
</head>
<body>
<nav><button id="nav-study" class="active" onclick="switchView('study')">📖 字母表</button><button id="nav-practice" onclick="switchView('practice')">🔀 随机认读</button><button id="nav-match" onclick="switchView('match')">🔗 六对六连线</button><button id="nav-friend" onclick="switchView('friend')">🤝 找朋友</button><button id="nav-listen" onclick="switchView('listen')">🔊 听音选字</button><button id="nav-mistakes" onclick="switchView('mistakes')">📝 错题本</button></nav>
<main>
<section id="view-study" class="view active card"><h2>英文字母表</h2><p class="sub">点击字母查看大小写、单词和图片</p><div id="alphabet-grid" class="alphabet-grid"></div></section>
<section id="view-practice" class="view card"><div id="practice-setup" class="setup"><h2>随机认读</h2><p class="sub">选择字母后大声读出卡片</p><div class="toolbar"><button class="btn outline" onclick="selectAll('practice',true)">全选</button><button class="btn outline" onclick="selectAll('practice',false)">全不选</button></div><div id="practice-toggle-grid" class="toggle-grid"></div><button class="btn primary" onclick="startPractice()">🚀 开始认读</button></div><div id="practice-run" class="flashcard-area"><h2>看字母，大声读出来</h2><div id="flashcard-display" class="flashcard">A</div><div class="actions"><button class="btn danger" onclick="answerPractice(false)">❌ 不认识</button><button class="btn success" onclick="answerPractice(true)">✅ 认识</button></div><p id="practice-progress" class="progress"></p><button class="btn outline" style="margin-top:18px" onclick="switchView('practice')">返回重选</button></div></section>
<section id="view-match" class="view card"><div id="match-setup" class="setup"><h2>六对六大小写连线</h2><p class="sub">每轮随机抽取6个字母，先点左侧再点右侧</p><div class="toolbar"><button class="btn outline" onclick="selectAll('match',true)">全选</button><button class="btn outline" onclick="selectAll('match',false)">全不选</button></div><div id="match-toggle-grid" class="toggle-grid"></div><button class="btn primary" onclick="startMatch()">🔗 开始连线</button></div><div id="match-run" class="match-area"><h2>把大小写连起来</h2><p class="help">左边大写 ↔ 右边小写，连对后出现绿色连线</p><div id="match-score" class="score">0 / 6</div><div id="match-board" class="match-board"><svg id="line-layer" class="line-layer"></svg><div id="upper-column" class="match-column"><h3>大写字母</h3></div><div id="lower-column" class="match-column"><h3>小写字母</h3></div></div><button id="next-match-btn" class="btn primary hidden" onclick="nextMatchRound()">下一轮</button><button class="btn outline" style="margin-left:8px" onclick="switchView('match')">返回重选</button></div></section>
<section id="view-friend" class="view card"><div id="friend-setup" class="setup"><h2>找朋友</h2><p class="sub">保留原来的玩法：看到一个字母，点击它对应的大小写朋友</p><div class="toolbar"><button class="btn outline" onclick="selectAll('friend',true)">全选</button><button class="btn outline" onclick="selectAll('friend',false)">全不选</button></div><div id="friend-toggle-grid" class="toggle-grid"></div><button class="btn primary" onclick="startFriend()">🤝 开始找朋友</button></div><div id="friend-run" class="match-area"><h2>找到它的好朋友</h2><p class="help">大写找小写，小写找大写</p><div id="friend-target" class="friend-target">A</div><div id="friend-options" class="friend-options"></div><button id="next-friend-btn" class="btn primary hidden" style="margin-top:25px" onclick="nextFriend()">下一题</button><br><button class="btn outline" style="margin-top:18px" onclick="switchView('friend')">返回重选</button></div></section>
<section id="view-listen" class="view card"><div id="listen-setup" class="setup"><h2>听音选字</h2><p class="sub">听发音，找出正确的字母</p><div class="toolbar"><button class="btn outline" onclick="selectAll('listen',true)">全选</button><button class="btn outline" onclick="selectAll('listen',false)">全不选</button></div><div id="listen-toggle-grid" class="toggle-grid"></div><button class="btn primary" onclick="startListen()">🔊 开始听音</button></div><div id="listen-run" class="match-area"><h2>听音选字</h2><button class="btn primary" style="font-size:40px;border-radius:50%;width:100px;height:100px" onclick="playCurrentAudio()">🔊</button><div id="listen-options" class="actions" style="margin-top:25px"></div><button id="next-listen-btn" class="btn primary hidden" style="margin-top:25px" onclick="nextListen()">下一题</button><br><button class="btn outline" style="margin-top:18px" onclick="switchView('listen')">返回重选</button></div></section>
<section id="view-mistakes" class="view card"><h2>错题本</h2><div class="toolbar"><button class="btn danger" onclick="clearMistakes()">🗑️ 清空</button><button class="btn primary" onclick="practiceMistakes()">♻️ 去认读复习</button></div><div id="mistakes-container"></div></section>
</main>
<div id="letter-modal" class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><div id="modal-letter" class="modal-letter">Aa</div><div id="modal-emoji" class="modal-emoji">🍎</div><div id="modal-word" class="modal-word">Apple</div></div></div>
<script>
const alphabetData=[{u:'A',l:'a',word:'Apple',emoji:'🍎',d:['o','e','c']},{u:'B',l:'b',word:'Ball',emoji:'🏀',d:['d','p','q']},{u:'C',l:'c',word:'Cat',emoji:'🐱',d:['e','o','a']},{u:'D',l:'d',word:'Dog',emoji:'🐶',d:['b','p','q']},{u:'E',l:'e',word:'Elephant',emoji:'🐘',d:['c','a','o']},{u:'F',l:'f',word:'Fish',emoji:'🐟',d:['t','l','j']},{u:'G',l:'g',word:'Gorilla',emoji:'🦍',d:['q','p','y']},{u:'H',l:'h',word:'Hat',emoji:'🎩',d:['n','b','k']},{u:'I',l:'i',word:'Igloo',emoji:'🛖',d:['l','j','t']},{u:'J',l:'j',word:'Juice',emoji:'🧃',d:['i','l','f']},{u:'K',l:'k',word:'Kangaroo',emoji:'🦘',d:['h','x','y']},{u:'L',l:'l',word:'Lion',emoji:'🦁',d:['i','t','r']},{u:'M',l:'m',word:'Monkey',emoji:'🐒',d:['n','w','h']},{u:'N',l:'n',word:'No',emoji:'🚫',d:['m','h','u']},{u:'O',l:'o',word:'Octopus',emoji:'🐙',d:['c','e','a']},{u:'P',l:'p',word:'Pig',emoji:'🐷',d:['q','b','d']},{u:'Q',l:'q',word:'Question',emoji:'❓',d:['p','g','d']},{u:'R',l:'r',word:'Ring',emoji:'💍',d:['n','h','t']},{u:'S',l:'s',word:'Sun',emoji:'☀️',d:['z','c','e']},{u:'T',l:'t',word:'Train',emoji:'🚂',d:['f','l','i']},{u:'U',l:'u',word:'Umbrella',emoji:'☂️',d:['v','n','w']},{u:'V',l:'v',word:'Van',emoji:'🚐',d:['u','w','y']},{u:'W',l:'w',word:'Watch',emoji:'⌚',d:['v','m','u']},{u:'X',l:'x',word:'Box',emoji:'📦',d:['y','k','v']},{u:'Y',l:'y',word:'Yellow',emoji:'🟡',d:['v','x','g']},{u:'Z',l:'z',word:'Zoo',emoji:'🦓',d:['s','x','c']}];
let mistakes=JSON.parse(localStorage.getItem('english_mistakes')||'[]'),practiceQueue=[],matchSelected=[],matchPairs=[],matchScore=0,selectedUpper=null,friendQueue=[],friendCurrent=null,listenQueue=[],currentListenIndex=0,currentListenChar='';const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function saveMistakes(){localStorage.setItem('english_mistakes',JSON.stringify(mistakes))}function addMistake(i){if(!mistakes.includes(i)){mistakes.push(i);saveMistakes()}}
function switchView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');document.getElementById('nav-'+id)?.classList.add('active');if(['practice','match','friend','listen'].includes(id))initSelector(id);if(id==='study')initStudy();if(id==='mistakes')renderMistakes()}
function initStudy(){let g=document.getElementById('alphabet-grid');g.innerHTML='';alphabetData.forEach((x,i)=>{let b=document.createElement('button');b.className='letter-btn';b.innerHTML=x.u+x.l+'<small>'+x.word+'</small>';b.onclick=()=>openModal(i);g.appendChild(b)})}function openModal(i){let x=alphabetData[i];document.getElementById('modal-letter').innerText=x.u+' '+x.l;document.getElementById('modal-emoji').innerText=x.emoji;document.getElementById('modal-word').innerText=x.word;document.getElementById('letter-modal').style.display='grid'}function closeModal(){document.getElementById('letter-modal').style.display='none'}
function initSelector(type){document.getElementById(type+'-setup').style.display='block';document.getElementById(type+'-run').style.display='none';let g=document.getElementById(type+'-toggle-grid');if(!g.children.length)alphabetData.forEach((x,i)=>{let b=document.createElement('button');b.className='toggle selected';b.innerText=x.u+x.l;b.dataset.index=i;b.onclick=()=>b.classList.toggle('selected');g.appendChild(b)})}function selectAll(type,on){document.querySelectorAll('#'+type+'-toggle-grid .toggle').forEach(x=>x.classList.toggle('selected',on))}function getSelected(type){return [...document.querySelectorAll('#'+type+'-toggle-grid .toggle.selected')].map(x=>+x.dataset.index)}
function startPractice(custom=null){let ids=custom||getSelected('practice');if(!ids.length)return alert('请至少选择一个字母哦！');practiceQueue=shuffle(ids.flatMap(i=>[{char:alphabetData[i].u,index:i},{char:alphabetData[i].l,index:i}]));document.getElementById('practice-setup').style.display='none';document.getElementById('practice-run').style.display='block';showNextPracticeCard()}function showNextPracticeCard(){if(!practiceQueue.length){alert('🎉 太棒了，练习完成！');return switchView('practice')}document.getElementById('flashcard-display').innerText=practiceQueue[0].char;document.getElementById('practice-progress').innerText='剩余：'+practiceQueue.length+' 个'}function answerPractice(ok){let x=practiceQueue.shift();if(!ok)addMistake(x.index);showNextPracticeCard()}
function startMatch(){let ids=getSelected('match');if(ids.length<6)return alert('连线题至少选择6个字母！');matchSelected=shuffle([...ids]);document.getElementById('match-setup').style.display='none';document.getElementById('match-run').style.display='block';nextMatchRound()}function nextMatchRound(){matchPairs=shuffle([...matchSelected]).slice(0,6);matchScore=0;selectedUpper=null;document.getElementById('next-match-btn').classList.add('hidden');document.getElementById('match-score').innerText='0 / 6';let up=document.getElementById('upper-column'),lo=document.getElementById('lower-column');up.innerHTML='<h3>大写字母</h3>';lo.innerHTML='<h3>小写字母</h3>';matchPairs.forEach(i=>{let b=document.createElement('button');b.className='match-item';b.innerText=alphabetData[i].u;b.dataset.index=i;b.onclick=()=>selectUpper(b,i);up.appendChild(b)});shuffle([...matchPairs]).forEach(i=>{let b=document.createElement('button');b.className='match-item';b.innerText=alphabetData[i].l;b.dataset.index=i;b.onclick=()=>selectLower(b,i);lo.appendChild(b)});document.getElementById('line-layer').innerHTML=''}function selectUpper(btn,i){if(btn.classList.contains('matched'))return;document.querySelectorAll('#upper-column .match-item').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');selectedUpper={btn,i}}function selectLower(btn,i){if(btn.classList.contains('matched')||!selectedUpper)return;let p=selectedUpper;selectedUpper=null;p.btn.classList.remove('selected');if(p.i!==i){btn.classList.add('wrong');p.btn.classList.add('wrong');addMistake(p.i);setTimeout(()=>{btn.classList.remove('wrong');p.btn.classList.remove('wrong')},450);return}btn.classList.add('matched');p.btn.classList.add('matched');matchScore++;document.getElementById('match-score').innerText=matchScore+' / 6';drawLine(p.btn,btn);if(matchScore===6)document.getElementById('next-match-btn').classList.remove('hidden')}function drawLine(a,b){let svg=document.getElementById('line-layer'),board=document.getElementById('match-board').getBoundingClientRect(),r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect(),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',r1.left+r1.width/2-board.left);line.setAttribute('y1',r1.top+r1.height/2-board.top);line.setAttribute('x2',r2.left+r2.width/2-board.left);line.setAttribute('y2',r2.top+r2.height/2-board.top);svg.appendChild(line)}
/* 保留原有找朋友：一道题一个目标，四个选项 */function startFriend(){friendQueue=shuffle(getSelected('friend').map(i=>({index:i})));if(!friendQueue.length)return alert('请至少选择一个字母哦！');document.getElementById('friend-setup').style.display='none';document.getElementById('friend-run').style.display='block';nextFriend()}function nextFriend(){if(!friendQueue.length){alert('🎉 找朋友全部完成！');return switchView('friend')}document.getElementById('next-friend-btn').classList.add('hidden');friendCurrent=friendQueue.shift();let x=alphabetData[friendCurrent.index],upper=Math.random()>.5,target=upper?x.u:x.l,correct=upper?x.l:x.u,opts=shuffle([correct,...(upper?x.d.map(y=>y):x.d.map(y=>y.toUpperCase()))]);document.getElementById('friend-target').innerText=target;let box=document.getElementById('friend-options');box.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='friend-option';b.innerText=o;b.onclick=()=>checkFriend(b,o===correct,correct);box.appendChild(b)})}function checkFriend(btn,ok,correct){if(document.querySelector('#friend-options .correct'))return;if(ok)btn.classList.add('correct');else{btn.classList.add('wrong');addMistake(friendCurrent.index);[...document.querySelectorAll('#friend-options .friend-option')].find(x=>x.innerText===correct).classList.add('correct')}document.getElementById('next-friend-btn').classList.remove('hidden')}
function startListen(){listenQueue=shuffle(getSelected('listen'));if(!listenQueue.length)return alert('请至少选择一个字母哦！');document.getElementById('listen-setup').style.display='none';document.getElementById('listen-run').style.display='block';nextListen()}function nextListen(){if(!listenQueue.length){alert('🎉 听力练习完成！');return switchView('listen')}document.getElementById('next-listen-btn').classList.add('hidden');currentListenIndex=listenQueue.shift();let x=alphabetData[currentListenIndex],upper=Math.random()>.5;currentListenChar=upper?x.u:x.l;let opts=shuffle([currentListenChar,...(upper?x.d.map(y=>y.toUpperCase()):x.d)]),box=document.getElementById('listen-options');box.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='btn outline';b.style.fontSize='28px';b.innerText=o;b.onclick=()=>checkListen(b,o===currentListenChar);box.appendChild(b)});setTimeout(playCurrentAudio,250)}function playCurrentAudio(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(alphabetData[currentListenIndex].u);u.lang='en-US';u.rate=.75;speechSynthesis.speak(u)}function checkListen(b,ok){if(document.querySelector('#listen-options .success'))return;if(ok)b.className='btn success';else{b.className='btn danger';addMistake(currentListenIndex);[...document.querySelectorAll('#listen-options button')].find(x=>x.innerText===currentListenChar).className='btn success'}document.getElementById('next-listen-btn').classList.remove('hidden')}
function renderMistakes(){let c=document.getElementById('mistakes-container');if(!mistakes.length){c.innerHTML='<div class="empty">🎉 厉害！当前没有错题！</div>';return}c.innerHTML='<div class="mistakes-grid">'+mistakes.map(i=>'<div class="mistake-item">'+alphabetData[i].u+alphabetData[i].l+'</div>').join('')+'</div>'}function clearMistakes(){if(confirm('确定要清空错题本吗？')){mistakes=[];saveMistakes();renderMistakes()}}function practiceMistakes(){if(!mistakes.length)return alert('没有错题需要练习哦！');switchView('practice');startPractice(mistakes)}initStudy();
</script>
</body>
</html>
